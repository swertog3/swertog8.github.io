<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="openFormBtn">Оставить заявку</button>

    <div id="popup" class="hidden">
        <form id="feedbackForm">
            <input type="text" id="fio" placeholder="ФИО" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Телефон" required>
            <input type="text" id="organization" placeholder="Организация">
            <textarea id="message" placeholder="Сообщение" required></textarea>
            <label>
                Согласен с политикой обработки персональных данных
                <input type="checkbox" id="policyAgree" required>
            </label>
            <button type="submit">Отправить</button>
            <button type="button" id="closeBtn">Закрыть</button>
        </form>
    </div>

    <div id="messageBox"></div>

    <script src="script.js"></script>
</body>
</html>
